# Publish a GitHub Release for a pushed tag, with every wifi4 binary attached.
#
# The building lives in build-binaries.yml (the single place that knows how to build a binary);
# this workflow only calls it and publishes the result:
#   1. `binaries` calls build-binaries.yml (workflow_call), which builds+smoke-tests each target
#      and uploads every artifact.
#   2. `release` waits for it, DOWNLOADS all artifacts, and attaches them to a GitHub Release
#      for the pushed tag (softprops/action-gh-release).
#
# Trigger: push a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
# Dry run: the "Run workflow" button (workflow_dispatch) builds + uploads artifacts you can
# download from the run, but SKIPS publishing a Release (no tag -> the release job is gated off).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Don't cancel a release build that's already publishing; just queue per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build all binaries
    uses: ./.github/workflows/build-binaries.yml

  release:
    name: Publish GitHub Release
    needs: [binaries]
    # Only publish for an actual tag push; a manual workflow_dispatch just leaves the
    # artifacts attached to the run for download.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the Release and upload assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true  # flatten every artifact into ./artifacts

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true   # auto-changelog from commits/PRs since the last tag
          fail_on_unmatched_files: true
          # Mark PEP 440 pre-releases (…aN / …bN / …rcN, e.g. v0.1.0a1) as GitHub pre-releases;
          # a plain vX.Y.Z tag publishes as a normal release.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
