# One button (or one tag) -> version bump, all binaries, GitHub Release.
#
# "Run workflow" on this workflow does the whole release, in order:
#   1. `version`  bumps the fork counter in src/wifi4/__init__.py (0.7.1+opx.1 -> 0.7.1+opx.2),
#                 commits it to main, creates the v<version> tag and pushes both.
#   2. `binaries` calls build-binaries.yml with that tag, so every artifact really contains the
#                 new version (Windows x64, Linux x64, Linux arm64, macOS universal2, Termux wheel).
#   3. `release`  downloads the artifacts and publishes them on a GitHub Release for the tag.
# Pushing a v* tag by hand does the same minus the bump: build the tag, publish the Release.
#
# Dry run: untick "Publish release" in the Run workflow form to build + upload artifacts with no
# version bump, no tag and no Release.
#
# The bump commit is pushed with GITHUB_TOKEN, and GitHub doesn't run workflows for token pushes,
# so this never re-triggers the push build twice.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Bump the version, tag it and publish a GitHub Release (untick for a build-only dry run)"
        type: boolean
        default: true

# Never cancel a release mid-publish; just queue per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    # Only a manual run bumps: a tag push already carries its version.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the bump commit and the tag
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump the +opx counter, commit and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          file=src/wifi4/__init__.py
          current=$(grep -m1 '^__version__ = ' "$file" | sed -E 's/.*"(.*)".*/\1/')
          base=${current%%+*}
          counter=0
          [[ $current == *+opx.* ]] && counter=${current##*+opx.}
          next="${base}+opx.$((counter + 1))"
          tag="v${next}"
          echo "current=$current  next=$next  tag=$tag"

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "::error::$tag already exists; bump the version by hand first"
            exit 1
          fi

          # Rewrite only the __version__ literal — the single source of truth hatchling reads.
          python3 - "$file" "$next" <<'PY'
          import pathlib, re, sys
          path, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          source = path.read_text(encoding="utf-8")
          patched = re.sub(r'^__version__ = ".*"$', f'__version__ = "{version}"',
                           source, count=1, flags=re.M)
          if patched == source:
              sys.exit("no __version__ literal rewritten")
          path.write_text(patched, encoding="utf-8")
          PY

          git config user.name "OP AMINUL FF"
          git config user.email "opx.team.official@gmail.com"
          git add "$file"
          git commit -m "chore(release): wifi4 $next"
          git tag "$tag"
          git push origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build all binaries
    needs: [version]
    # Run after a successful bump, and also when `version` was skipped (tag push / dry run).
    if: ${{ always() && needs.version.result != 'failure' && needs.version.result != 'cancelled' }}
    uses: ./.github/workflows/build-binaries.yml
    with:
      # A manual release builds the tag it just created; a tag push builds that tag.
      ref: ${{ needs.version.outputs.tag || github.ref }}

  release:
    name: Publish GitHub Release
    needs: [version, binaries]
    # Publish for a tag push, or for a manual run with "Publish release" ticked. Nothing to
    # publish in a dry run.
    if: ${{ always() && needs.binaries.result == 'success' &&
            (startsWith(github.ref, 'refs/tags/') || needs.version.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the Release and upload its assets
    steps:
      # One resolution of "which tag are we publishing": the bumped tag on a manual release,
      # the pushed tag otherwise. Everything below keys off it, never off github.ref_name (which
      # is the branch name, e.g. "main", on a manual run).
      - name: Resolve the release tag
        id: tag
        run: echo "name=${{ needs.version.outputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true  # flatten every artifact into ./artifacts

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: wifi4 ${{ steps.tag.outputs.name }}
          files: artifacts/**
          generate_release_notes: true   # auto-changelog from commits/PRs since the last tag
          fail_on_unmatched_files: true
          # Mark PEP 440 pre-releases (…aN / …bN / …rcN, e.g. v0.1.0a1) as GitHub pre-releases;
          # a plain vX.Y.Z tag publishes as a normal release.
          prerelease: ${{ contains(steps.tag.outputs.name, 'a') || contains(steps.tag.outputs.name, 'b') || contains(steps.tag.outputs.name, 'rc') }}
